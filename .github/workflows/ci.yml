name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI + GRU4Rec)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite httpx

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=app

  frontend-build:
    name: Frontend Build & Lint (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: recommendation-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./recommendation-frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: ./recommendation-frontend
        run: npm run lint

      - name: Run Production Build
        working-directory: ./recommendation-frontend
        run: npm run build
